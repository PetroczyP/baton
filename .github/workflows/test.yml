name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Actions minutes are free on public repositories; while the repository is private
    # (before the directory listing goes live) the tests run locally instead.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: "22"}
          - {os: ubuntu-latest, node: "24"}
          - {os: macos-latest, node: "24"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Mod tests on the real file system (node:test)
        run: node --test tests/node/*.test.mjs
      # The version Torch is tested with; the README names it.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.292
      - name: Validate the plugin
        run: claude plugin validate --strict .
      - name: Mod tests in Claude Code's engine (claude plugin test)
        run: claude plugin test
